<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090a"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
<title>FitPlus | مهدی حقیقی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090a;--c:#151517;--c2:#202023;--r:#ff2d3d;--r2:#ff6b4a;--t:#f4f4f5;--m:#9b9ba3;--l:#2d2d31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:400 15px/1.8 Vazirmatn,Tahoma,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 16px 60px}
h1{font-weight:800;font-size:34px;margin:6px 0 0;letter-spacing:-.5px}h2{font-size:21px;margin:10px 0}h3{font-size:16px;margin:20px 0 8px;color:var(--r2)}
.m{color:var(--m)}.hero{text-align:center;padding-top:10px}
.lw{background:#fff;border-radius:18px;display:inline-block;padding:4px 14px}.lw img{height:62px;display:block}
.ph{width:210px;height:210px;border-radius:50%;display:block;margin:18px auto 6px;box-shadow:0 0 50px #ff2d3d55}
.stk{display:grid;gap:10px;margin-top:22px}
button,.vid{font:inherit;cursor:pointer;border:0;border-radius:14px;color:var(--t)}
.b{background:linear-gradient(135deg,var(--r),#c4121f);padding:13px;font-weight:600;width:100%;margin-top:10px;font-size:16px}
.b.o{background:none;border:1.5px solid var(--r)}.b.g{background:var(--c2)}
.bk{background:none;color:var(--m);padding:4px 0}
.row{display:block;width:100%;text-align:right;background:var(--c);padding:13px 16px;margin:8px 0;border:1px solid var(--l)}
label{display:block;font-size:13px;color:var(--m);margin:8px 0}
input,select,textarea{width:100%;font:inherit;background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:10px 12px;margin-top:3px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--r);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph2{background:var(--c);border:1px dashed var(--l);border-radius:12px;padding:8px;text-align:center;font-size:12px}.ph2 input{display:none}.ph2 img{width:100%;border-radius:8px;margin-top:4px}
.bmi{background:var(--c2);border-radius:12px;padding:10px;text-align:center;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips span,.chips button{background:var(--c2);border-radius:20px;padding:2px 12px;font-size:13px}
.chips .on{background:var(--r)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--c);border:1px solid var(--l);padding:18px 8px;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px}.tile b{font-size:14px;font-weight:600}
.msg{background:linear-gradient(135deg,#2a0b0e,var(--c));border-radius:16px;padding:14px 16px;border-right:4px solid var(--r);margin:12px 0}
.rem{background:#33270a;color:#ffd166;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.warn{background:#2a1013;border:1px solid #5a1b22;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum div{background:var(--c2);border-radius:12px;padding:10px;text-align:center}.sum b{display:block;font-size:20px}
.up{color:#ff8a8a;font-style:normal}.dn{color:#7be495;font-style:normal}
.ex{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px 14px;margin:8px 0}
.vid{display:inline-block;background:var(--c2);padding:4px 14px;text-decoration:none;font-size:13px;margin-top:4px;color:var(--r2)}
.x{background:none;color:var(--m);font-size:12px;float:left}
.day{border-top:1px solid var(--l);margin-top:16px}
.add{background:var(--c2);border-radius:14px;padding:10px;margin-top:10px}.add input{margin:3px 0}
details{background:var(--c);border-radius:12px;padding:8px 12px;margin:6px 0}summary{cursor:pointer}
.cmp{position:relative;direction:ltr;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cmp input{position:absolute;bottom:6px;left:5%;width:90%;z-index:2}
.cmp span{position:absolute;top:8px;background:#000a;padding:0 10px;border-radius:10px;font-size:12px;z-index:2}
svg text{fill:var(--m);font:10px Vazirmatn,sans-serif}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--r);padding:8px 18px;border-radius:20px;z-index:9}
@media(prefers-reduced-motion:no-preference){.ph{animation:in .7s ease-out}@keyframes in{from{opacity:0;transform:scale(.92)}}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--l);text-align:center}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:16px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--r),#c4121f);font-size:24px;z-index:8;box-shadow:0 4px 18px #ff2d3d66}.av{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--c2);display:block;margin:6px auto}

.b:not(.g):not(.o){color:#fff}.chips .on{color:#fff}.toast{color:#fff}
.tw{overflow-x:auto}.mt{width:100%;border-collapse:collapse;font-size:15px}.mt th{background:var(--c2);padding:9px 6px;font-weight:600}.mt td{padding:10px 6px;border-bottom:1px solid var(--l);text-align:center}.mt td:nth-child(2){text-align:right}.mt .mh{background:var(--c2);font-weight:600;width:74px}.mt tfoot td{font-weight:800;color:var(--r2);border-bottom:0}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f5f7;--c:#ffffff;--c2:#ececf1;--t:#16161a;--m:#6a6a74;--l:#d8d8e0}.rem{background:#fff4d6;color:#7a5200}.warn{background:#ffeceb;border-color:#f3b8b4}.msg{background:linear-gradient(135deg,#ffe9ea,#fff)}.ph{box-shadow:0 0 40px #ff2d3d33}.lw{box-shadow:0 6px 30px #0001}}
.spb{background:none;border:1px solid var(--l);color:var(--m);padding:6px 18px;border-radius:20px;font-size:13px;display:block;margin:20px auto 0}
.phc img{aspect-ratio:3/4;object-fit:cover;background:var(--c2)}.rem[data-a]{cursor:pointer}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#09090a"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body><div id="app"></div>
